<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GBSMedConnect</title>


    <style>

        /* =========================================
           CONFIGURAÇÕES GERAIS
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #e8f3fb;

            color: #1f2937;

        }


        /* =========================================
           CONTAINER PRINCIPAL
        ========================================= */

        .login-container {

            width: 100%;

            min-height: 100vh;

            display: grid;

            grid-template-columns: 50% 50%;

        }


        /* =========================================
           LADO ESQUERDO
           FUNDO CLARO + LOGO
        ========================================= */

        .login-left {

            min-height: 100vh;

            background: #e8f3fb;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 60px 50px;

            position: relative;

            overflow: hidden;

        }


        /* círculos decorativos */

        .login-left::before {

            content: "";

            position: absolute;

            width: 520px;

            height: 520px;

            border-radius: 50%;

            background: rgba(20, 118, 232, 0.035);

            top: -230px;

            left: -230px;

        }


        .login-left::after {

            content: "";

            position: absolute;

            width: 480px;

            height: 480px;

            border-radius: 50%;

            background: rgba(32, 184, 166, 0.035);

            bottom: -250px;

            right: -220px;

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-area {

            width: 100%;

            max-width: 650px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            z-index: 2;

            margin-bottom: 0;

        }


        .logo-area img {

            width: 100%;

            max-width: 620px;

            max-height: 430px;

            object-fit: contain;

            display: block;

        }


        /* =========================================
           LADO DIREITO
           FUNDO AZUL FORTE
        ========================================= */

        .login-right {

            min-height: 100vh;

            background: #1261d4;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px;

            position: relative;

            overflow: hidden;

        }


        /* decoração do lado azul */

        .login-right::before {

            content: "";

            position: absolute;

            width: 600px;

            height: 600px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.035);

            top: -280px;

            right: -250px;

        }


        .login-right::after {

            content: "";

            position: absolute;

            width: 500px;

            height: 500px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.025);

            bottom: -250px;

            left: -250px;

        }


        /* =========================================
           CAIXA DO LOGIN
        ========================================= */

        .login-box {

            width: 100%;

            max-width: 390px;

            position: relative;

            z-index: 2;

        }


        /* =========================================
           CABEÇALHO
        ========================================= */

        .login-header {

            text-align: center;

            margin-bottom: 38px;

        }


        /* =========================================
           LOGO NO CABEÇALHO DO LOGIN
        ========================================= */

        .login-header-logo {
    width: 165px;
    height: 145px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border-radius: 0;
    padding: 0;
    overflow: visible;
}

.login-header-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

        .login-header-logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

        }


        .login-header h1 {

            color: #ffffff;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .login-header p {

            color: rgba(255, 255, 255, 0.72);

            font-size: 12px;

        }


        /* =========================================
           CAMPOS
        ========================================= */

        .form-group {

            margin-bottom: 19px;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #7d8b96;

            font-size: 15px;

            z-index: 2;

        }


        .form-group input {

            width: 100%;

            height: 50px;

            border: 1px solid #d5dce1;

            border-radius: 5px;

            background: #ffffff;

            color: #333333;

            padding: 0 15px 0 42px;

            outline: none;

            font-size: 13px;

            transition: 0.2s ease;

        }


        .form-group input::placeholder {

            color: #8b969e;

        }


        .form-group input:focus {

            border-color: #ffffff;

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.15);

        }


        /* =========================================
           OPÇÕES
        ========================================= */

        .login-options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: -3px;

            margin-bottom: 23px;

        }


        .remember-me {

            display: flex;

            align-items: center;

            gap: 6px;

            color: rgba(255, 255, 255, 0.78);

            font-size: 11px;

            cursor: pointer;

        }


        .remember-me input {

            width: 13px;

            height: 13px;

            accent-color: #ffffff;

            cursor: pointer;

        }


        .forgot-password {

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 11px;

            cursor: pointer;

        }


        .forgot-password:hover {

            text-decoration: underline;

        }


        /* =========================================
           BOTÃO
        ========================================= */

        .login-button {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 5px;

            background: #ffffff;

            color: #1261d4;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

            box-shadow:
                0 7px 18px rgba(0, 0, 0, 0.10);

        }


        .login-button:hover {

            background: #f4f8fb;

            transform: translateY(-1px);

        }


        .login-button:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================================
           MENSAGEM
        ========================================= */

        .login-message {

            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 12px;

        }


        .login-message.error {

            color: #ffd1d1;

        }


        .login-message.success {

            color: #bff8e8;

        }


        /* =========================================
           RODAPÉ
        ========================================= */

        .login-footer {

            text-align: center;

            color: rgba(255, 255, 255, 0.55);

            font-size: 10px;

            margin-top: 32px;

        }


        /* =========================================
           RESPONSIVO
        ========================================= */

        @media (max-width: 850px) {

            .login-container {

                grid-template-columns: 1fr;

            }


            .login-left {

                min-height: 430px;

                padding: 40px 25px;

            }


            .logo-area {

                margin-bottom: 25px;

            }


            .logo-area img {

                max-height: 290px;

            }


            .login-right {

                min-height: 600px;

                padding: 50px 25px;

            }

        }


        @media (max-width: 480px) {

            .login-left {

                min-height: 350px;

                padding: 25px 15px;

            }


            .logo-area img {

                max-height: 220px;

            }


            .login-right {

                min-height: 560px;

                padding: 40px 20px;

            }


            .login-header-logo {

                width: 105px;

                height: 105px;

            }


            .login-header h1 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


    <main class="login-container">


        <!-- =====================================
             LADO ESQUERDO - LOGO
        ====================================== -->

        <section class="login-left">


            <div class="logo-area">

                <img
                    src="../IMG/logo-gbsmedconnect.png"
                    alt="GBSMedConnect - Consultório Médico & Conexão"
                >

            </div>


        </section>


        <!-- =====================================
             LADO DIREITO - LOGIN
        ====================================== -->

        <section class="login-right">


            <div class="login-box">


                <div class="login-header">


                    <div class="login-header-logo">
                        <img
                            src="../IMG/logo-gbsmedconnect.png"
                            alt="GBSMedConnect - Consultório Médico & Conexão"
                        >
                    </div>


                    <h1>
                        GBSMedConnect
                    </h1>


                    <p>
                        Gestão médica eficiente, organizada e segura
                    </p>


                </div>


                <form id="loginForm">


                    <!-- E-MAIL -->

                    <div class="form-group">

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉
                            </span>

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="E-mail"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- SENHA -->

                    <div class="form-group">

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Senha"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                    </div>


                    <!-- OPÇÕES -->

                    <div class="login-options">


                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            Lembrar-me

                        </label>


                        <button
                            type="button"
                            id="forgotPasswordButton"
                            class="forgot-password"
                        >
                            Esqueci minha senha
                        </button>


                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >
                        Entrar
                    </button>


                    <!-- MENSAGEM -->

                    <div
                        id="loginMessage"
                        class="login-message"
                    ></div>


                </form>


                <div class="login-footer">

                    GBSMedConnect © 2026

                </div>


            </div>


        </section>


    </main>


    <script
        type="module"
        src="../js/auth.js"
    ></script>

<!-- Atualização GitHub Pages -->
</body>

</html>
